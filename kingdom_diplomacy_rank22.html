:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color-scheme:dark;--bg:#0b1220;--panel:#172338;--line:#314158;--text:#edf2f9;--muted:#aab8ce;--red:#f87171;--blue:#60a5fa;--yellow:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#101a2bf5;border-bottom:1px solid var(--line);padding:14px max(14px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:18px;margin:0}small,.muted{color:var(--muted)}.shell{max-width:1080px;margin:auto;padding:16px 14px 95px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.stat{text-align:center}.stat b{font-size:23px;display:block}.stat small{font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn{border:1px solid #51637d;background:#273750;color:white;border-radius:9px;padding:10px 12px}.btn.primary{background:#2563eb;border-color:#3b82f6}.btn.danger{background:#642b38}.btn:disabled{opacity:.4}.tabs{position:fixed;z-index:7;bottom:0;left:0;right:0;background:#152137;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}.tabs button{padding:12px 1px;background:none;color:#9cacc2;border:0;font-size:11px}.tabs button.active{color:white;background:#2b4262}.tabs span{display:block;font-size:19px;margin-bottom:3px}input,select,textarea{width:100%;padding:11px;background:#0e192b;border:1px solid #475b78;border-radius:9px;color:white}label{display:block;font-size:13px;color:#b9c7db;margin-bottom:6px}.field{margin:0 0 12px}.section-title{margin:18px 0 10px;font-size:16px}.guild{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:#24344b;border:1px solid #334962;border-radius:9px;padding:11px;margin-top:7px;color:white}.tag{display:inline-block;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:650;color:#101827}.pill{display:inline-block;border:1px solid #54647c;padding:4px 7px;border-radius:99px;font-size:12px;color:#cbd5e1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scroll{overflow:auto}.matrix{border-collapse:separate;border-spacing:3px;white-space:nowrap;font-size:12px}.matrix th{position:sticky;top:0;background:#23344c;padding:8px}.matrix td{min-width:39px;text-align:center}.matrix button{border:0;border-radius:5px;padding:8px 11px;color:#09111f;font-weight:bold;width:100%}.relation{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #33445c}.relation:last-child{border:0}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.legend span{font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.notice{border-left:3px solid #fbbf24;padding:10px;background:#302c25;font-size:12px;color:#f4d9a0}.hide{display:none!important}svg{width:100%;height:auto;touch-action:pan-y}svg text{font-family:system-ui,sans-serif}.network-label{fill:#f8fafc;font-size:10px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.mutedline{font-size:12px;color:var(--muted);line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.side{border-left:4px solid;padding-left:10px}.empty{color:var(--muted);padding:18px;text-align:center}@media(min-width:700px){.tabs{position:static;max-width:1080px;margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0}.tabs button{font-size:13px}.shell{padding-bottom:30px}.stats{grid-template-columns:repeat(3,180px)}}

<header><div><h1>⚔️ キングダム覇道｜外交情報局</h1><small id="updated"></small></div><button class="btn" id="modeBtn">🔒 閲覧モード</button></header>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), pub=JSON.parse($('#published-data').textContent), KEY='hadou_diplomacy_v3_20261111_hostility';let data=structuredClone(pub),tab='factions',selected='月桂冠',search='',editor=false,netType='すべて';const F={one:{label:'one₋room側',color:'#f87171'},jin:{label:'燼華側',color:'#60a5fa'},possible:{label:'燼華側の可能性',color:'#fbbf24'},neutral:{label:'中立',color:'#d1d5db'},unknown:{label:'未確認',color:'#94a3b8'}},C={'同盟':'#4ade80','友好':'#facc15','不戦':'#38bdf8','敵対':'#fb7185','未確認':'#94a3b8'};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');const save=()=>{data.updated=today();localStorage.setItem(KEY,JSON.stringify(data))};const pair=(a,b)=>data.relations.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));const guild=n=>data.guilds.find(g=>g.name===n);const opts=(arr,chosen)=>arr.map(x=>`<option value="${esc(x)}" ${x===chosen?'selected':''}>${esc(x)}</option>`).join('');const gopts=chosen=>opts(data.guilds.map(x=>x.name),chosen);const tag=(type)=>`<span class="tag" style="background:${C[type]||C['未確認']}">${esc(type)}</span>`;const colorSide=g=>F[g.faction]||F.unknown;const fmtPower=n=>Number.isFinite(n)?n.toLocaleString('ja-JP')+' Pt':'戦闘力未登録';
function setTab(t){tab=t;render()}function render(){if(!guild(selected))selected=data.guilds[0]?.name||'';$('#updated').textContent='公開データ更新日：'+pub.updated+' ／ 表示データ：'+(editor?'この端末の編集中データ':'公開版');$('#modeBtn').textContent=editor?'✏️ 編集中':'🔒 閲覧モード';$('#guildCount').textContent=data.guilds.length;$('#relationCount').textContent=data.relations.length;$('#unknownCount').textContent=Math.max(0,data.guilds.length*(data.guilds.length-1)/2-data.relations.length);document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab==='manage')b.classList.toggle('hide',!editor)});$('#content').innerHTML=({factions:drawFactions,network:drawNetwork,matrix:drawMatrix,detail:drawDetail,ranking:drawRanking,manage:drawManage}[tab]||drawFactions)();bind()}
function drawFactions(){return `<div class="field"><input id="search" placeholder="🔍 軍団名で検索" value="${esc(search)}"></div>`+Object.entries(F).map(([id,f])=>{let gs=data.guilds.filter(g=>g.faction===id&&g.name.toLowerCase().includes(search.toLowerCase()));if(!gs.length)return '';return `<section class="card" style="margin-bottom:12px;border-left:4px solid ${f.color}"><div class="row"><strong>${f.label}</strong><small>${gs.length}軍団</small></div>${gs.map(g=>`<button class="guild" data-open="${esc(g.name)}"><span>${esc(g.name)}</span><small>${g.rank?g.rank+'位':'順位未登録'}<br>${fmtPower(g.power)}　›</small></button>`).join('')}</section>`}).join('')}
function drawNetwork(){let rel=data.relations.filter(r=>(r.a===selected||r.b===selected)&&(netType==='すべて'||r.type===netType));let count=rel.length, nodes=rel.map((r,i)=>{let angle=-Math.PI/2+2*Math.PI*i/Math.max(count,1);return {name:r.a===selected?r.b:r.a,type:r.type,x:180+127*Math.cos(angle),y:170+122*Math.sin(angle)}});return `<div class="card"><h3 style="margin-top:0">軍団別 外交相関図</h3><div class="field"><label>中心となる軍団</label><select id="selectGuild">${gopts(selected)}</select></div><div class="field"><label>外交関係の絞り込み</label><select id="netType">${opts(['すべて',...Object.keys(C)],netType)}</select></div><svg viewBox="0 0 360 340" role="img" aria-label="${esc(selected)}の外交関係">${nodes.map(n=>`<line x1="180" y1="170" x2="${n.x}" y2="${n.y}" stroke="${C[n.type]}" stroke-width="2.6"/>`).join('')}${nodes.map(n=>`<g><circle cx="${n.x}" cy="${n.y}" r="30" fill="#263750" stroke="${C[n.type]}" stroke-width="2"/><text class="network-label" x="${n.x}" y="${n.y}">${esc(n.name.length>8?n.name.slice(0,7)+'…':n.name)}</text></g>`).join('')}<circle cx="180" cy="170" r="43" fill="#344967" stroke="white" stroke-width="2"/><text class="network-label" x="180" y="170" style="font-weight:700;font-size:12px">${esc(selected.length>8?selected.slice(0,7)+'…':selected)}</text></svg><div class="legend">${Object.entries(C).map(([k,v])=>`<span><i class="dot" style="background:${v}"></i>${k}</span>`).join('')}</div><p class="mutedline">線は登録済みの外交関係のみを示します。${count>0?count+'件表示中':'該当する関係は未登録です。'}</p></div>`}
function drawMatrix(){return `<div class="card"><h3 style="margin-top:0">全軍団 外交マトリクス</h3><p class="mutedline">横スクロール対応。マスをタップすると軍団詳細を開きます。「？」は未確認です。</p><div class="scroll"><table class="matrix"><thead><tr><th>軍団</th>${data.guilds.map(g=>`<th title="${esc(g.name)}">${esc(g.name.length>5?g.name.slice(0,4)+'…':g.name)}</th>`).join('')}</tr></thead><tbody>${data.guilds.map(a=>`<tr><th>${esc(a.name)}</th>${data.guilds.map(b=>{if(a===b)return '<td>—</td>';let p=pair(a.name,b.name),t=p?.type||'未確認';return `<td><button style="background:${C[t]}" data-matrix="${esc(a.name)}" title="${esc(a.name)} × ${esc(b.name)}：${t}">${({同盟:'同',友好:'友',不戦:'不',敵対:'敵',未確認:'?'})[t]}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function drawDetail(){let g=guild(selected),rs=data.relations.filter(r=>r.a===selected||r.b===selected);return `<div class="card"><div class="field"><label>軍団を選択</label><select id="selectGuild">${gopts(selected)}</select></div>${g?`<div class="side" style="border-color:${colorSide(g).color}"><h2 style="margin:0 0 8px">${esc(g.name)}</h2><span class="pill">${colorSide(g).label}</span> <span class="pill">${g.rank?g.rank+'位':'順位未登録'}</span> <span class="pill">${fmtPower(g.power)}</span></div>`:''}<h3 class="section-title">外交関係（${rs.length}件）</h3>${rs.length?rs.map(r=>`<div class="relation"><span>${esc(r.a===selected?r.b:r.a)}</span>${tag(r.type)}</div>`).join(''):'<p class="empty">外交関係の登録がありません</p>'}<h3 class="section-title">外交メモ</h3><p class="mutedline" style="white-space:pre-wrap">${esc(data.notes[selected]||'メモ未登録')}</p>${editor?`<button class="btn primary" id="editGuild">この軍団を編集</button>`:''}</div>`}
function drawRanking(){let gs=[...data.guilds].sort((a,b)=>(a.rank??999)-(b.rank??999));return `<div class="card"><h3 style="margin:0 0 8px">🏆 軍団戦闘力ランキング</h3><p class="mutedline">画像確認：${esc(data.rankingUpdated||'更新日未登録')} ／ 戦闘力はゲーム内表示値</p>${gs.map(g=>`<button class="guild" data-open="${esc(g.name)}" style="border-left:4px solid ${colorSide(g).color}"><span style="min-width:0"><strong>${g.rank?g.rank+'位':'—'}　${esc(g.name)}</strong><br><small>${colorSide(g).label}</small></span><span style="white-space:nowrap;text-align:right;font-weight:650">${fmtPower(g.power)}<br><small>詳細 ›</small></span></button>`).join('')}</div>`}
function drawManage(){return `<div class="notice">この端末での編集は、公開サイトには自動反映されません。「公開用HTMLを書き出す」で保存し、GitHub PagesのHTMLを差し替えてください。</div><h3 class="section-title">軍団を追加・編集</h3><div class="card"><div class="field"><label>編集する軍団（新規追加なら「新規」を選択）</label><select id="manageGuild"><option value="">＋ 新規追加</option>${gopts(selected)}</select></div><div class="field"><label>軍団名</label><input id="guildName" placeholder="軍団名"></div><div class="grid2"><div class="field"><label>所属勢力</label><select id="faction">${Object.entries(F).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div><div class="field"><label>戦力順位（任意）</label><input id="rank" type="number" min="1" placeholder="例：5"></div></div><div class="field"><label>戦闘力（Pt、任意）</label><input id="power" type="number" min="0" step="1" placeholder="例：2179738"></div><div class="actions"><button class="btn primary" id="saveGuild">軍団を保存</button><button class="btn danger" id="deleteGuild">軍団を削除</button></div></div><h3 class="section-title">外交関係を追加・更新</h3><div class="card"><div class="grid2"><div class="field"><label>軍団A</label><select id="relA">${gopts(selected)}</select></div><div class="field"><label>軍団B</label><select id="relB">${gopts(data.guilds.find(x=>x.name!==selected)?.name)}</select></div></div><div class="field"><label>外交関係</label><select id="relType">${opts(Object.keys(C),'友好')}</select></div><div class="actions"><button class="btn primary" id="saveRelation">関係を保存</button><button class="btn danger" id="deleteRelation">関係を削除</button></div></div><h3 class="section-title">外交メモ</h3><div class="card"><div class="field"><label>対象軍団</label><select id="noteGuild">${gopts(selected)}</select></div><div class="field"><textarea id="noteText" rows="4" placeholder="外交交渉、情報源、注意事項など"></textarea></div><button class="btn primary" id="saveNote">メモを保存</button></div><h3 class="section-title">バックアップ・公開</h3><div class="card"><div class="actions"><button class="btn" id="exportJson">JSONバックアップ</button><button class="btn" id="importJson">JSONを読み込む</button><input type="file" id="jsonFile" accept=".json,application/json" hidden></div><p class="mutedline">JSONは編集データの保存・復元用です。</p><button class="btn primary" style="width:100%;margin-top:6px" id="exportHtml">📤 公開用HTMLを書き出す</button><p class="mutedline">書き出したHTMLは閲覧モードで始まります。公開先のGitHub Pagesへアップロードして差し替えてください。</p><button class="btn danger" id="reset" style="width:100%">編集中データを公開版に戻す</button></div>`}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;setTab('detail')});document.querySelectorAll('[data-matrix]').forEach(b=>b.onclick=()=>{selected=b.dataset.matrix;setTab('detail')});if($('#search'))$('#search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;$('#content').innerHTML=drawFactions();bind();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#selectGuild'))$('#selectGuild').onchange=e=>{selected=e.target.value;render()};if($('#netType'))$('#netType').onchange=e=>{netType=e.target.value;render()};if($('#editGuild'))$('#editGuild').onclick=()=>{setTab('manage');$('#manageGuild').value=selected;fillGuild()};if(tab==='manage')bindManage()}
function fillGuild(){let g=guild($('#manageGuild').value);$('#guildName').value=g?.name||'';$('#faction').value=g?.faction||'unknown';$('#rank').value=g?.rank||'';$('#power').value=g?.power??''}
function bindManage(){fillGuild();$('#manageGuild').onchange=fillGuild;$('#saveGuild').onclick=()=>{let old=$('#manageGuild').value,n=$('#guildName').value.trim(),f=$('#faction').value,r=$('#rank').value,p=$('#power').value;if(!n)return alert('軍団名を入力してください');if(data.guilds.some(g=>g.name===n&&g.name!==old))return alert('同じ名前の軍団が存在します');if(old){let g=guild(old);g.name=n;g.faction=f;g.rank=r?Number(r):null;g.power=p!==''?Number(p):null;data.relations.forEach(x=>{if(x.a===old)x.a=n;if(x.b===old)x.b=n});if(data.notes[old]!==undefined){data.notes[n]=data.notes[old];if(n!==old)delete data.notes[old]}}else data.guilds.push({name:n,faction:f,rank:r?Number(r):null,power:p!==''?Number(p):null});selected=n;save();render();alert('軍団を保存しました')};$('#deleteGuild').onclick=()=>{let n=$('#manageGuild').value;if(!n)return;if(!confirm(n+'を削除しますか？関連する外交関係も削除されます。'))return;data.guilds=data.guilds.filter(g=>g.name!==n);data.relations=data.relations.filter(r=>r.a!==n&&r.b!==n);delete data.notes[n];save();render()};$('#relA').onchange=fillRel;$('#relB').onchange=fillRel;function fillRel(){let p=pair($('#relA').value,$('#relB').value);$('#relType').value=p?.type||'未確認'}fillRel();$('#saveRelation').onclick=()=>{let a=$('#relA').value,b=$('#relB').value,t=$('#relType').value;if(!a||!b||a===b)return alert('異なる2軍団を選択してください');let p=pair(a,b);if(p)p.type=t;else data.relations.push({a,b,type:t});save();render();alert('外交関係を保存しました')};$('#deleteRelation').onclick=()=>{let a=$('#relA').value,b=$('#relB').value;if(!pair(a,b))return alert('この組み合わせは未登録です');if(!confirm('この外交関係を削除しますか？'))return;data.relations=data.relations.filter(r=>!((r.a===a&&r.b===b)||(r.a===b&&r.b===a)));save();render()};$('#noteGuild').onchange=()=>{$('#noteText').value=data.notes[$('#noteGuild').value]||''};$('#noteText').value=data.notes[selected]||'';$('#saveNote').onclick=()=>{data.notes[$('#noteGuild').value]=$('#noteText').value;save();alert('メモを保存しました')};$('#exportJson').onclick=()=>download(JSON.stringify(data,null,2),'hadou-diplomacy-backup.json','application/json');$('#importJson').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());validate(d);if(!confirm('現在の編集中データを読み込んだデータで置き換えますか？'))return;data=d;save();render()}catch(err){alert('読み込み失敗：'+err.message)}};$('#exportHtml').onclick=()=>{let clone=document.documentElement.cloneNode(true),node=clone.querySelector('#published-data');node.textContent=JSON.stringify(data).replace(/</g,'\\u003c');let html='<!doctype html>\n'+clone.outerHTML;download(html,'index.html','text/html');alert('index.htmlを保存しました。GitHub Pagesの公開ファイルと差し替えてください。')};$('#reset').onclick=()=>{if(!confirm('この端末の編集データを破棄して公開版に戻しますか？'))return;localStorage.removeItem(KEY);data=structuredClone(pub);render()}}
function validate(d){if(!d||!Array.isArray(d.guilds)||!Array.isArray(d.relations)||!d.guilds.every(g=>typeof g.name==='string'&&g.name.length>0&&F[g.faction])||!d.relations.every(r=>typeof r.a==='string'&&typeof r.b==='string'&&C[r.type]))throw Error('データ形式が正しくありません');if(new Set(d.guilds.map(g=>g.name)).size!==d.guilds.length)throw Error('軍団名が重複しています');if(d.relations.some(r=>r.a===r.b||!d.guilds.some(g=>g.name===r.a)||!d.guilds.some(g=>g.name===r.b)))throw Error('外交関係に不正な軍団名があります');let keys=d.relations.map(r=>[r.a,r.b].sort().join('\u0000'));if(new Set(keys).size!==keys.length)throw Error('外交関係が重複しています');d.notes=d.notes&&typeof d.notes==='object'?d.notes:{}}
function download(contents,name,mime){let blob=new Blob([contents],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('#modeBtn').onclick=()=>{if(editor){editor=false;data=structuredClone(pub);tab='factions';render();return}let pass=prompt('編集モードに切り替えますか？\nこの方式は端末内編集であり、パスワード認証ではありません。\n「編集」と入力してください。');if(pass!=='編集')return;editor=true;try{let local=localStorage.getItem(KEY);if(local){let d=JSON.parse(local);validate(d);data=d}}catch(e){alert('保存データの読み込みに失敗しました。公開版を表示します。');data=structuredClone(pub)}setTab('manage')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));render();
})();</script></body></html>
